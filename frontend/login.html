<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login | ACE Outsource Solutions</title>
  <link rel="icon" type="image/png" href="assets/ACE.png">
  <link rel="stylesheet" href="ace.css">
</head>
<body class="login-page login-gate-pending">
  <main class="not-found-shell" data-login-not-found>
    <span class="eyebrow">Page not found</span>
    <h1>Nothing to see here.</h1>
    <p>The page you requested could not be found.</p>
    <a class="btn btn-dark" href="index.html">Return home</a>
  </main>
  <main class="login-shell" data-login-shell hidden>
    <a class="login-brand" href="index.html">
      <img src="assets/ACE.png" alt="ACE Outsource Solutions">
      <span><strong>ACE Outsource Solutions</strong><span>Expert Service, Beyond Borders</span></span>
    </a>
    <span class="eyebrow">Admin access</span>
    <h1 data-login-title>Welcome back.</h1>
    <p class="login-intro" data-login-intro>Sign in to manage ACE website content.</p>
    <form class="login-form" data-login-form method="post" action="#">
      <div class="field"><label for="admin-email">Email address</label><input id="admin-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-dark" type="submit" data-login-submit disabled>Sign in</button>
      <div class="form-status" data-login-status role="status"></div>
    </form>
    <a class="login-back" href="index.html">← Back to website</a>
  </main>
  <script src="config.js"></script>
  <script src="cms.js"></script>
  <script src="login.js"></script>
</body>
</html>
